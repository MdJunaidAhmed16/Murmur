[project]
name = "murmur"
version = "0.1.0"
description = "A local voice agent that answers fast and remembers you."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "structlog",
    "numpy",
    "openai",
    # 1.26 is the last CUDA 12 build. Later ones ship CUDA 13 with a libcudnn.so.9 of the same
    # name as the CUDA 12 one ctranslate2 loads; two in one process is asking for trouble.
    # Still provides the CPU provider that VAD and embeddings use.
    "onnxruntime-gpu==1.26.0",
    "faster-whisper",
    "kokoro-onnx",
    # ctranslate2 and onnxruntime load CUDA at runtime; these wheels supply it without a
    # system CUDA install. One set, CUDA 12, shared by STT and TTS.
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
    "fastembed>=0.9.0",
    "mcp>=2.3.0",
]

[tool.uv]
# kokoro-onnx and fastembed depend on the CPU-only "onnxruntime"; both packages install the same
# module, so the GPU build replaces it rather than sitting alongside it.
override-dependencies = ["onnxruntime ; sys_platform == 'never'"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pre-commit",
    "websockets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/murmur"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF", "T20", "BLE"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "kokoro_onnx.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
