<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Murmur</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #f7f6f3; --surface: #ffffff; --text: #1f1d1a; --muted: #6b6760;
      --border: #e4e1da; --accent: #3b5bdb; --cut: #b8b3a8; --ok: #2f9e44; --err: #c92a2a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161514; --surface: #1f1e1c; --text: #ecebe8; --muted: #9a968f;
        --border: #34322e; --accent: #748ffc; --cut: #5c5953; --ok: #51cf66; --err: #ff6b6b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
    header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    h1 { font-size: 22px; margin: 0 auto 0 0; letter-spacing: -0.01em; }
    button {
      font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: 0.45; cursor: default; }
    #status { font-size: 13px; color: var(--muted); }
    #status::before {
      content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 6px; background: var(--cut);
    }
    #status[data-state="live"]::before { background: var(--ok); }
    #status[data-state="error"]::before { background: var(--err); }
    .panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; margin-bottom: 16px;
    }
    #transcript { min-height: 220px; max-height: 50vh; overflow-y: auto; }
    .line { display: flex; gap: 10px; padding: 6px 0; }
    .who { flex: 0 0 64px; color: var(--muted); font-size: 13px; padding-top: 1px; }
    .line.assistant .text { color: var(--accent); }
    .line.cut .text { color: var(--cut); }
    .line.cut .text::after { content: " — interrupted"; font-size: 12px; }
    #partial { color: var(--muted); font-style: italic; min-height: 1.5em; }
    h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 8px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
    th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { color: var(--muted); font-weight: 500; }
    .hint { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Murmur</h1>
    <span id="status" data-state="idle">Idle</span>
    <button id="start" class="primary">Start talking</button>
    <button id="stop" disabled>Stop</button>
  </header>

  <section class="panel">
    <div id="transcript"></div>
    <div id="partial"></div>
  </section>

  <section class="panel">
    <h2>Per-turn latency (ms)</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>endpoint</th><th>stt_final</th><th>memory_recall</th><th>llm_first_token</th><th>llm_first_sentence</th>
            <th>tts_first_audio</th><th>time_to_first_audio</th><th>barge-in</th>
          </tr>
        </thead>
        <tbody id="metrics-body"></tbody>
      </table>
    </div>
  </section>

  <p class="hint">Use Chrome or Edge. Headphones stop the agent hearing itself.</p>
</main>
<script src="/static/app.js"></script>
</body>
</html>
